<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="커버 메이커">
<meta name="description" content="휴대폰에서 사진 한 장으로 매거진 표지를 만드는 도구. 설치 없이 브라우저 안에서 끝납니다.">
<title>매거진 커버 메이커 · 모바일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
__FONTLINKS__
<style>
__TOKENS__
  /* 모바일에서만 쓰는 값 */
  :root{--card:rgba(255,255,255,.62); --cardTop:rgba(255,255,255,.94)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --card:rgba(28,28,38,.55); --cardTop:rgba(22,22,31,.94)} }
  :root[data-theme="dark"]{--card:rgba(28,28,38,.55); --cardTop:rgba(22,22,31,.94)}

  *{box-sizing:border-box}
  html,body{-webkit-text-size-adjust:100%}
  /* 머리말·미리보기·하단 바는 제자리에 두고 설정만 스크롤한다.
     (페이지 전체를 스크롤하면 끝에서 마지막 항목이 미리보기에 가린다) */
  body{margin:0;background:var(--bg);color:var(--tx);
       font:14px/1.6 "Noto Sans KR","Segoe UI",system-ui,sans-serif;
       display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
       overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  body::before{
    content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
    background:
      radial-gradient(38% 44% at 12% 16%, var(--b1) 0%, transparent 62%),
      radial-gradient(36% 42% at 88% 10%, var(--b2) 0%, transparent 60%),
      radial-gradient(46% 48% at 76% 86%, var(--b3) 0%, transparent 62%),
      radial-gradient(42% 42% at 20% 90%, var(--b4) 0%, transparent 60%);
    filter:blur(34px);opacity:.92;
  }

  /* ---------- 머리말 (폰 목업 스튜디오와 같은 구성) ---------- */
  #head{flex:0 0 auto;z-index:30;display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;
        padding:calc(env(safe-area-inset-top) + 9px) 14px 9px;
        background:var(--glass);
        -webkit-backdrop-filter:blur(26px) saturate(180%);
        backdrop-filter:blur(26px) saturate(180%);
        border-bottom:1px solid var(--line)}
  #brand{height:19px;width:auto;display:block;flex:0 0 auto;filter:invert(1)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #brand{filter:none} }
  :root[data-theme="dark"] #brand{filter:none}
  h1{margin:0;font-size:14.5px;font-weight:700;color:var(--tx);line-height:1.3;
     padding-left:10px;border-left:1px solid var(--fieldBd);white-space:nowrap}
  #head p{margin:0;flex:1 0 100%;order:3;color:var(--tx2);font-size:11.5px}
  #head .ic{margin-left:auto;order:2;width:32px;height:32px;flex:0 0 32px;padding:0;border-radius:50%;
            min-height:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}

  /* ---------- 본문: 미리보기 + 설정 레일 ---------- */
  .work{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;padding:10px 12px 0}
  .card,#stage,#side{border-radius:18px;background:var(--card);
       -webkit-backdrop-filter:blur(22px) saturate(180%);
       backdrop-filter:blur(22px) saturate(180%);
       border:1px solid var(--gEdge);box-shadow:var(--gShadow)}

  /* 미리보기는 스크롤해도 화면 위에 붙어 있다 */
  #stage{flex:0 0 auto;background:var(--cardTop);
         display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 12px 10px}
  .cvwrap{position:relative;display:flex;align-items:center;justify-content:center;
          width:100%;height:var(--pvH, 38dvh)}
  #cv{max-width:100%;max-height:100%;display:block;touch-action:none;
      box-shadow:var(--shadow);background:#000;border-radius:5px}
  #bar{font-size:11px;color:var(--tx2);padding:3px 12px;border-radius:999px;
       background:var(--glass2);border:1px solid var(--gEdge);max-width:100%;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
         text-align:center;border:1.5px dashed var(--sb);border-radius:12px;background:var(--glass2)}
  #empty.off{display:none}
  #empty .msg{padding:13px 16px;border-radius:14px;color:var(--tx2);font-size:12.5px;line-height:1.6;
              background:var(--glass);border:1px solid var(--gEdge);box-shadow:var(--gShadow);
              -webkit-backdrop-filter:blur(16px) saturate(180%);
              backdrop-filter:blur(16px) saturate(180%)}
  #empty b{display:block;font-size:15px;color:var(--tx);margin-bottom:4px}

  /* 필름스트립 — 미리보기 카드 안쪽 아래 (사진 두 장 이상일 때) */
  #film{display:none;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  #film.on{display:block}
  #thumbs{display:flex;gap:6px;padding:2px}
  .th{position:relative;flex:0 0 50px;width:50px;aspect-ratio:3/4;border-radius:8px;overflow:hidden;
      border:2px solid transparent;background:#000}
  .th img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .th.on{border-color:var(--acc)}
  .th .x{position:absolute;top:0;right:0;width:18px;height:18px;border-radius:0 0 0 7px;
         background:#000a;color:#fff;font-size:11px;line-height:18px;text-align:center}

  /* ---------- 설정 레일 (여기만 스크롤) ---------- */
  #side{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
        -webkit-overflow-scrolling:touch;padding:2px 0 6px;position:relative}
  #side::-webkit-scrollbar{width:7px}
  #side::-webkit-scrollbar-thumb{background:var(--sb);border-radius:4px}
  .sec{border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;background:transparent}
  .sec:last-of-type{border-bottom:0}
  .sec>summary{cursor:pointer;padding:15px 16px 12px;font-weight:700;font-size:14px;list-style:none;
               display:flex;align-items:center;gap:8px;user-select:none}
  .sec>summary::-webkit-details-marker{display:none}
  .sec>summary::after{content:"\25BE";color:var(--tx2);font-size:11px;margin-left:10px}
  .sec[open]>summary::after{content:"\25B4"}
  .sec>summary>button{margin-left:auto;min-height:0;padding:3px 9px;border-radius:8px}
  .sec .body{padding:0 16px 16px}

  /* ---------- 하단 고정 바 ---------- */
  .dock{flex:0 0 auto;z-index:40;display:flex;gap:8px;
        padding:10px 12px calc(10px + env(safe-area-inset-bottom));
        background:var(--glass);
        -webkit-backdrop-filter:blur(26px) saturate(180%);
        backdrop-filter:blur(26px) saturate(180%);
        border-top:1px solid var(--gEdge)}
  .dock button{flex:1 1 0;min-height:46px;font-size:14.5px}

  /* ---------- 설정 요소 (PC 판과 같은 결, 손가락 크기로) ---------- */
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:11px 0;min-width:0}
  .row label.k{flex:0 0 auto;font-size:13px;color:var(--tx2);line-height:1.3}
  .row .grow{flex:1 1 auto;min-width:0}
  .row input[type=text],.row select{flex:1 1 auto;min-width:0}
  .row button.mini{flex:0 0 auto;margin-right:auto;padding:6px 11px;font-size:13px;
                   min-height:0;border-radius:9px}

  /* 글꼴 16px — 이보다 작으면 아이폰이 입력할 때 화면을 확대한다 */
  input[type=text],textarea,select{width:100%;background:var(--field);color:var(--tx);
      border:1px solid var(--fieldBd);border-radius:10px;padding:10px 11px;font:inherit;font-size:16px;
      box-shadow:var(--fieldSh)}
  select{appearance:none;-webkit-appearance:none;padding-right:34px;min-height:44px;
      text-overflow:ellipsis;white-space:nowrap;overflow:hidden;
      background-image:var(--chevImg);
      background-repeat:no-repeat;background-position:right 12px center}
  input[type=text]{min-height:44px}
  input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);
      box-shadow:0 0 0 3px rgba(220,63,92,.18)}
  input[type=text]::placeholder,textarea::placeholder{color:var(--tx2);opacity:.8}
  textarea{resize:vertical;min-height:76px;line-height:1.45;margin-top:2px}

  /* 슬라이더는 이름·값이 위, 트랙이 아래 한 줄 가득 — 손가락으로 미세 조절하기 좋게 */
  input[type=range]{width:100%;height:30px;margin:0;touch-action:pan-y;
      -webkit-appearance:none;appearance:none;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:var(--sb)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-9px;
      border-radius:50%;background:var(--field);border:1.7px solid var(--acc);
      box-shadow:0 1px 5px rgba(20,20,45,.28)}
  input[type=range]::-moz-range-track{height:2px;border-radius:2px;background:var(--sb)}
  input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;
      background:var(--field);border:1.7px solid var(--acc)}
  #fTmp::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,#5b8dd9,#e8c85a)}
  #fTmp::-moz-range-track{height:3px;background:linear-gradient(90deg,#5b8dd9,#e8c85a)}
  #fTint::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,#5fbf7a,#d066c4)}
  #fTint::-moz-range-track{height:3px;background:linear-gradient(90deg,#5fbf7a,#d066c4)}
  @supports selector(:has(*)){
    .row:has(> input[type=range]){display:grid;grid-template-columns:1fr auto;align-items:center;
        column-gap:8px;margin:5px 0 7px}
    .row:has(> input[type=range]) > label.k{grid-area:1/1;font-size:12.5px;color:var(--tx)}
    .row:has(> input[type=range]) > .val{grid-area:1/2;font-size:12px}
    .row:has(> input[type=range]) > input[type=range]{grid-area:2/1/3/3;width:100%}
  }
  input[type=color]{width:46px;height:36px;flex:0 0 46px;padding:0;border:1px solid var(--fieldBd);
      border-radius:9px;background:var(--field);box-shadow:var(--fieldSh)}
  .val{flex:0 0 46px;text-align:right;font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums}

  .sw{display:flex;align-items:center;gap:10px;flex:1;min-width:0;font-size:13px;padding:2px 0;
      justify-content:flex-end;text-align:right}
  .sw input{-webkit-appearance:none;appearance:none;position:relative;flex:0 0 40px;order:2;
      width:40px;height:23px;margin:0;border-radius:999px;background:var(--sb);
      border:0;transition:.16s;cursor:pointer}
  .sw input::after{content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;
      border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:.16s}
  .sw input:checked{background:var(--acc)}
  .sw input:checked::after{transform:translateX(17px)}

  button{background:var(--field);color:var(--tx);border:1px solid var(--fieldBd);border-radius:11px;
         padding:10px 13px;font:inherit;font-size:13.5px;min-height:44px;
         box-shadow:var(--fieldSh);-webkit-appearance:none}
  button:active{filter:brightness(.94)}
  button.pri{background:var(--acc);color:var(--accTx);border-color:transparent;font-weight:700;
             box-shadow:0 6px 18px rgba(220,63,92,.30)}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btns button{flex:1 1 auto}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .chip{flex:1 1 auto;text-align:center;padding:11px 10px;border:1px solid var(--fieldBd);
        border-radius:10px;font-size:13px;background:var(--field);color:var(--tx);
        box-shadow:var(--fieldSh);white-space:nowrap}
  .chip.on{background:var(--acc);color:var(--accTx);border-color:transparent;font-weight:700}
  .hint{font-size:12px;color:var(--tx2);line-height:1.6;margin:8px 0 0;word-break:keep-all}

  #drop{border:1.5px dashed var(--sb);border-radius:13px;padding:16px 10px;text-align:center;
        color:var(--tx2);font-size:13px;background:var(--glass2)}
  #drop.over{border-color:var(--acc);color:var(--tx)}

  #curveWrap{border:1px solid var(--gEdge);border-radius:11px;overflow:hidden;background:var(--graph)}
  #curve{display:block;width:100%;height:190px;touch-action:none}
  .chan{display:flex;gap:5px;margin:9px 0 7px}
  .chan div{flex:1;text-align:center;padding:10px 0;font-size:12.5px;border-radius:9px;
            border:1px solid var(--fieldBd);background:var(--field);color:var(--tx);
            box-shadow:var(--fieldSh)}
  .chan div.on{background:var(--acc);color:var(--accTx);border-color:transparent;font-weight:700}

  #theme{display:flex;border:1px solid var(--fieldBd);border-radius:999px;overflow:hidden;
         background:var(--field);box-shadow:var(--fieldSh)}
  #theme button{flex:1;border:0;border-radius:0;padding:9px 6px;font-size:12.5px;background:transparent;
                color:var(--tx2);min-height:0;box-shadow:none}
  #theme button+button{border-left:1px solid var(--line)}
  #theme button.on{background:var(--acc);color:var(--accTx);font-weight:700}

  #toast{position:fixed;left:50%;transform:translateX(-50%);
         bottom:calc(80px + env(safe-area-inset-bottom));z-index:41;
         background:var(--glass);color:var(--tx);
         -webkit-backdrop-filter:blur(20px) saturate(180%);
         backdrop-filter:blur(20px) saturate(180%);
         border:1px solid var(--gEdge);box-shadow:var(--gShadow);
         padding:10px 18px;border-radius:999px;font-size:12.5px;
         opacity:0;pointer-events:none;transition:.25s}
  #toast.on{opacity:1}

  /* ---------- 저장 진행창 ---------- */
  #progBg{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
          padding:24px;background:rgba(8,8,18,.46);
          -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
  #progBg.on{display:flex}
  #prog{width:100%;max-width:420px;border-radius:16px;padding:18px 18px 14px;
        background:var(--glass);color:var(--tx);
        -webkit-backdrop-filter:blur(30px) saturate(180%);
        backdrop-filter:blur(30px) saturate(180%);
        border:1px solid var(--gEdge);box-shadow:var(--shadow)}
  #prog .h{font-size:15px;font-weight:700;padding-bottom:12px;border-bottom:1px solid var(--line)}
  #prog .f{font-size:12.5px;color:var(--tx2);margin:12px 0 10px;word-break:break-all}
  #prog .r{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2);margin-bottom:7px}
  #prog .bar{height:5px;border-radius:3px;background:var(--sb);overflow:hidden}
  #prog .bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--acc);transition:width .2s}
  #prog .foot{display:flex;justify-content:flex-end;margin-top:14px}
  #prog .foot button{border-radius:999px;padding:8px 20px}

  /* 완료 알림 */
  #done{position:fixed;left:10px;right:10px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:71;
        display:none;align-items:center;gap:10px;padding:13px 14px;border-radius:13px;
        background:rgba(24,104,72,.96);color:#fff;font-size:13px;
        box-shadow:0 10px 28px rgba(0,0,0,.28)}
  #done.on{display:flex}
  #done .ck{flex:0 0 20px;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.22);
            text-align:center;line-height:20px;font-size:12px}
  #done span.t{flex:1;min-width:0}
  #done button{background:transparent;border:0;box-shadow:none;color:#fff;min-height:0;padding:4px 6px;
               font-size:14px;opacity:.85}

  /* ---------- 사진 가져오기 선택창 ---------- */
  #pickBg{position:fixed;inset:0;z-index:60;display:none;padding:0;
          align-items:flex-end;justify-content:center;background:rgba(8,8,18,.42);
          -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #pickBg.on{display:flex}
  #pick{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px;
        padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
        background:var(--glass);color:var(--tx);
        -webkit-backdrop-filter:blur(30px) saturate(180%);
        backdrop-filter:blur(30px) saturate(180%);
        border:1px solid var(--gEdge);border-radius:20px 20px 0 0;box-shadow:var(--shadow)}
  #pick .t{font-size:12px;color:var(--tx2);text-align:center;margin:2px 0 4px}
  #pick button{width:100%;padding:14px;font-size:14.5px;min-height:52px}
  #pick button.cancel{color:var(--tx2);margin-top:4px}

  /* ---------- 사용 방법 ---------- */
  #helpBg{position:fixed;inset:0;z-index:50;display:none;padding:0;
          align-items:flex-end;justify-content:center;background:rgba(8,8,18,.42);
          -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
  #helpBg.on{display:flex}
  #help{width:100%;max-height:88dvh;overflow-y:auto;border-radius:20px 20px 0 0;
        padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);
        background:var(--glass);color:var(--tx);
        -webkit-backdrop-filter:blur(30px) saturate(180%);
        backdrop-filter:blur(30px) saturate(180%);
        border:1px solid var(--gEdge);box-shadow:var(--shadow)}
  #help h2{margin:0;font-size:18px}
  #help .sub{color:var(--tx2);font-size:12.5px;margin:4px 0 2px}
  #help h3{margin:18px 0 6px;font-size:13px;color:var(--acc)}
  #help p{margin:6px 0;font-size:13px;line-height:1.75}
  #help ul{margin:6px 0;padding-left:18px}
  #help li{font-size:13px;line-height:1.8}
  #help b{font-weight:700}
  #help .foot{display:flex;justify-content:flex-end;margin-top:20px}

  /* 화면이 넓으면(태블릿·가로) 본문 폭만 가운데로 모은다 */
  @media (min-width:760px){
    .work{max-width:720px;margin:0 auto;width:100%}
    .dock{padding-left:calc((100vw - 720px)/2 + 12px);padding-right:calc((100vw - 720px)/2 + 12px)}
  }
</style>
</head>
<body>
