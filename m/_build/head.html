<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="커버 메이커">
<meta name="description" content="휴대폰에서 사진 한 장으로 매거진 표지를 만드는 도구. 설치 없이 브라우저 안에서 끝납니다.">
<title>매거진 커버 메이커 · 모바일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
__FONTLINKS__
<style>
__TOKENS__
  *{box-sizing:border-box}
  html{height:100%}
  html,body{-webkit-text-size-adjust:100%}
  body{margin:0;height:100%;background:var(--bg);color:var(--tx);
       font:14px/1.5 "Noto Sans KR","Segoe UI",system-ui,sans-serif;
       overflow:hidden;overscroll-behavior:none;
       -webkit-tap-highlight-color:transparent}
  body::before{
    content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;
    background:
      radial-gradient(38% 44% at 12% 16%, var(--b1) 0%, transparent 62%),
      radial-gradient(36% 42% at 88% 10%, var(--b2) 0%, transparent 60%),
      radial-gradient(46% 48% at 76% 86%, var(--b3) 0%, transparent 62%),
      radial-gradient(42% 42% at 20% 90%, var(--b4) 0%, transparent 60%);
    filter:blur(34px);opacity:.92;
  }
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  /* ---------- 상단 바 ---------- */
  #head{flex:0 0 auto;display:flex;align-items:center;gap:9px;z-index:7;
        padding:calc(env(safe-area-inset-top) + 7px) 12px 7px;
        padding-left:calc(env(safe-area-inset-left) + 12px);
        padding-right:calc(env(safe-area-inset-right) + 12px);
        background:var(--glass);
        -webkit-backdrop-filter:blur(26px) saturate(180%);
        backdrop-filter:blur(26px) saturate(180%);
        border-bottom:1px solid var(--line)}
  #brand{height:13px;width:auto;display:block;flex:0 0 auto;filter:invert(1)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) #brand{filter:none} }
  :root[data-theme="dark"] #brand{filter:none}
  h1{margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
     font:700 11px/1 "Bodoni Moda","Playfair Display",Georgia,serif;
     letter-spacing:.10em;text-transform:uppercase}
  @media (max-width:359px){ h1{display:none} }
  #theme{display:flex;border:1px solid var(--fieldBd);border-radius:999px;overflow:hidden;
         flex:0 0 auto;background:var(--field);box-shadow:var(--fieldSh)}
  #theme button{border:0;border-radius:0;padding:6px 8px;font-size:10.5px;background:transparent;
                color:var(--tx2);min-height:0;box-shadow:none}
  #theme button+button{border-left:1px solid var(--line)}
  #theme button.on{background:var(--acc);color:var(--accTx);font-weight:700}
  #helpBtn{width:29px;height:29px;flex:0 0 29px;padding:0;border-radius:50%;
           font-size:14px;font-weight:800;line-height:1;min-height:0}

  /* ---------- 미리보기 ---------- */
  #stage{flex:1 1 auto;min-height:0;position:relative;display:flex;
         align-items:center;justify-content:center;padding:9px}
  #cv{max-width:100%;max-height:100%;display:block;touch-action:none;
      box-shadow:var(--shadow);background:#000;border-radius:5px}
  #bar{position:absolute;left:50%;transform:translateX(-50%);bottom:5px;
       display:flex;gap:8px;align-items:center;font-size:11px;color:var(--tx2);
       padding:4px 12px;border-radius:999px;background:var(--glass);
       -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
       border:1px solid var(--gEdge);pointer-events:none;max-width:92%;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #empty{position:absolute;inset:9px;display:flex;flex-direction:column;gap:9px;
         align-items:center;justify-content:center;text-align:center;
         border:1.5px dashed var(--sb);border-radius:14px;color:var(--tx2);font-size:13px;
         background:var(--glass2)}
  #empty.off{display:none}
  #empty b{display:block;font-size:15px;color:var(--tx);margin-bottom:2px}

  /* ---------- 하단 시트 ---------- */
  #sheet{flex:0 0 auto;display:flex;flex-direction:column;min-height:0;height:56vh;z-index:6;
         background:var(--glass);
         -webkit-backdrop-filter:blur(26px) saturate(180%);
         backdrop-filter:blur(26px) saturate(180%);
         border-top:1px solid var(--gEdge);border-radius:19px 19px 0 0;
         box-shadow:0 -12px 34px rgba(20,20,45,.14)}
  #grab{flex:0 0 auto;height:24px;display:flex;align-items:center;justify-content:center;
        touch-action:none;user-select:none}
  #grab::after{content:"";width:46px;height:5px;border-radius:3px;background:var(--sb)}
  #tabs{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;
        padding:0 12px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #tabs::-webkit-scrollbar{display:none}
  #tabs .tab{flex:0 0 auto;padding:7px 13px;border:1px solid var(--fieldBd);border-radius:999px;
             font-size:12.5px;background:var(--field);color:var(--tx2);
             box-shadow:var(--fieldSh);white-space:nowrap}
  #tabs .tab.on{background:var(--acc);color:var(--accTx);border-color:transparent;font-weight:700}
  #side{flex:1 1 auto;min-height:0;overflow-y:auto;position:relative;
        padding:0 12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #side::after{content:"";display:block;height:16px}   /* 마지막 항목 아래 숨 쉴 공간 */
  #side::-webkit-scrollbar{width:8px}
  #side::-webkit-scrollbar-thumb{background:var(--sb);border-radius:4px}
  #dock{flex:0 0 auto;display:flex;gap:6px;align-items:center;
        padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);
        padding-left:calc(env(safe-area-inset-left) + 12px);
        padding-right:calc(env(safe-area-inset-right) + 12px);
        border-top:1px solid var(--line)}
  #dock button{flex:0 0 auto}
  #dock .sp{flex:1 1 auto}
  #nav{display:flex;align-items:center;gap:2px;font-size:11.5px;color:var(--tx2);
       font-variant-numeric:tabular-nums}
  #nav button{padding:8px 10px}
  #nav.off{display:none}

  /* ---------- 섹션 ---------- */
  .sec{border:1px solid var(--gEdge);border-radius:15px;margin-bottom:9px;overflow:hidden;
       background:var(--glass2);
       -webkit-backdrop-filter:blur(16px) saturate(160%);
       backdrop-filter:blur(16px) saturate(160%);scroll-margin-top:4px}
  .sec>summary{cursor:pointer;padding:13px 13px;font-weight:700;font-size:13.5px;list-style:none;
               display:flex;justify-content:space-between;align-items:center;user-select:none}
  .sec>summary::-webkit-details-marker{display:none}
  .sec>summary::after{content:"\25BE";color:var(--tx2);font-size:11px}
  .sec[open]>summary::after{content:"\25B4"}
  .sec .body{padding:8px 13px 15px;border-top:1px solid var(--line)}

  .row{display:flex;align-items:center;gap:9px;margin:11px 0;min-width:0}
  .row label.k{flex:0 0 74px;font-size:12px;color:var(--tx2);line-height:1.3}
  .row .grow{flex:1;min-width:0}

  /* 글꼴 16px — 이보다 작으면 아이폰에서 입력할 때 화면이 확대된다 */
  input[type=text],textarea,select{width:100%;background:var(--field);color:var(--tx);
      border:1px solid var(--fieldBd);border-radius:10px;padding:9px 11px;font:inherit;font-size:16px;
      box-shadow:var(--fieldSh)}
  select{appearance:none;-webkit-appearance:none;padding-right:34px;
      text-overflow:ellipsis;white-space:nowrap;overflow:hidden;
      background-image:var(--chevImg);
      background-repeat:no-repeat;background-position:right 12px center}
  input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);
      box-shadow:0 0 0 3px rgba(220,63,92,.18)}
  input[type=text]::placeholder,textarea::placeholder{color:var(--tx2);opacity:.8}
  textarea{resize:vertical;min-height:76px;line-height:1.45}
  input[type=range]{width:100%;accent-color:var(--acc);height:30px;margin:0;touch-action:pan-y}
  input[type=color]{width:44px;height:34px;flex:0 0 44px;padding:0;border:1px solid var(--fieldBd);
      border-radius:9px;background:var(--field);box-shadow:var(--fieldSh)}
  .val{flex:0 0 46px;text-align:right;font-size:11px;color:var(--tx2);font-variant-numeric:tabular-nums}

  .sw{display:flex;align-items:center;gap:9px;flex:1;min-width:0;font-size:13px;padding:4px 0}
  .sw input{accent-color:var(--acc);width:20px;height:20px;flex:0 0 20px;margin:0}

  button{background:var(--field);color:var(--tx);border:1px solid var(--fieldBd);border-radius:11px;
         padding:10px 13px;font:inherit;font-size:13px;min-height:40px;
         box-shadow:var(--fieldSh);-webkit-appearance:none}
  button:active{filter:brightness(.94)}
  button.pri{background:var(--acc);color:var(--accTx);border-color:transparent;font-weight:700;
             box-shadow:0 6px 18px rgba(220,63,92,.30)}
  .btns{display:flex;gap:6px;flex-wrap:wrap}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .chip{padding:8px 13px;border:1px solid var(--fieldBd);border-radius:999px;font-size:12.5px;
        background:var(--field);color:var(--tx);box-shadow:var(--fieldSh)}
  .chip.on{background:var(--acc);color:var(--accTx);border-color:transparent;font-weight:700}
  .hint{font-size:11.5px;color:var(--tx2);line-height:1.6;margin:8px 0 0}

  #drop{border:1.5px dashed var(--sb);border-radius:13px;padding:16px 10px;text-align:center;
        color:var(--tx2);font-size:13px;background:var(--glass2)}
  #drop.over{border-color:var(--acc);color:var(--tx)}
  #thumbs{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;-webkit-overflow-scrolling:touch}
  #thumbs:empty{display:none}
  .th{position:relative;flex:0 0 58px;width:58px;aspect-ratio:3/4;border-radius:9px;overflow:hidden;
      border:2px solid transparent;background:#000}
  .th img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .th.on{border-color:var(--acc)}
  .th .x{position:absolute;top:1px;right:1px;width:20px;height:20px;border-radius:50%;
         background:#000a;color:#fff;font-size:13px;line-height:20px;text-align:center}

  #curveWrap{border:1px solid var(--gEdge);border-radius:11px;overflow:hidden;background:var(--graph)}
  #curve{display:block;width:100%;height:200px;touch-action:none}
  .chan{display:flex;gap:5px;margin:9px 0 7px}
  .chan div{flex:1;text-align:center;padding:9px 0;font-size:12px;border-radius:9px;
            border:1px solid var(--fieldBd);background:var(--field);color:var(--tx);
            box-shadow:var(--fieldSh)}
  .chan div.on{background:var(--acc);color:var(--accTx);border-color:transparent;font-weight:700}

  #toast{position:fixed;left:50%;transform:translateX(-50%);
         bottom:calc(var(--sh, 56vh) + 44px);z-index:40;
         background:var(--glass);color:var(--tx);
         -webkit-backdrop-filter:blur(20px) saturate(180%);
         backdrop-filter:blur(20px) saturate(180%);
         border:1px solid var(--gEdge);box-shadow:var(--gShadow);
         padding:10px 18px;border-radius:999px;font-size:12.5px;
         opacity:0;pointer-events:none;transition:.25s}
  #toast.on{opacity:1}

  /* ---------- 사진 가져오기 선택창 ---------- */
  #pickBg{position:fixed;inset:0;z-index:60;display:none;padding:0;
          align-items:flex-end;justify-content:center;background:rgba(8,8,18,.42);
          -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #pickBg.on{display:flex}
  #pick{width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px;
        padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
        background:var(--glass);color:var(--tx);
        -webkit-backdrop-filter:blur(30px) saturate(180%);
        backdrop-filter:blur(30px) saturate(180%);
        border:1px solid var(--gEdge);border-radius:20px 20px 0 0;box-shadow:var(--shadow)}
  #pick .t{font-size:12px;color:var(--tx2);text-align:center;margin:2px 0 4px}
  #pick button{width:100%;padding:14px;font-size:14.5px;min-height:52px}
  #pick button.cancel{color:var(--tx2);margin-top:4px}

  /* ---------- 사용 방법 ---------- */
  #helpBg{position:fixed;inset:0;z-index:50;display:none;padding:0;
          align-items:flex-end;justify-content:center;background:rgba(8,8,18,.42);
          -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
  #helpBg.on{display:flex}
  #help{width:100%;max-height:88dvh;overflow-y:auto;border-radius:20px 20px 0 0;
        padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);
        background:var(--glass);color:var(--tx);
        -webkit-backdrop-filter:blur(30px) saturate(180%);
        backdrop-filter:blur(30px) saturate(180%);
        border:1px solid var(--gEdge);box-shadow:var(--shadow)}
  #help h2{margin:0;font-size:18px}
  #help .sub{color:var(--tx2);font-size:12.5px;margin:4px 0 2px}
  #help h3{margin:18px 0 6px;font-size:13px;color:var(--acc)}
  #help p{margin:6px 0;font-size:13px;line-height:1.75}
  #help ul{margin:6px 0;padding-left:18px}
  #help li{font-size:13px;line-height:1.8}
  #help b{font-weight:700}
  #help .foot{display:flex;justify-content:flex-end;margin-top:20px}

  /* 화면이 넓으면(태블릿·가로) 여백만 조금 넉넉하게 */
  @media (min-width:700px){
    #side{padding:0 max(12px, calc((100% - 660px)/2))}
    #tabs{padding:0 max(12px, calc((100% - 660px)/2)) 8px}
  }
</style>
</head>
<body>
